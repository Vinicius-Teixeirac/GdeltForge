<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a34"></stop><stop offset="1" stop-color="#0d1120"></stop></linearGradient>
  <clipPath id="round"><rect x="0" y="0" width="860" height="420" rx="14"></rect></clipPath></defs>
  <g clip-path="url(#round)">
    <rect width="860" height="420" fill="url(#bg)"></rect>
    <rect width="860" height="38" fill="#0a0e1c"></rect>
    <circle cx="24" cy="19" r="6" fill="#c3654f"></circle><circle cx="46" cy="19" r="6" fill="#c3a463"></circle><circle cx="68" cy="19" r="6" fill="#6f8f6b"></circle>
    <text text-anchor="middle" x="430" y="24" fill="#5b6480" font-size="13" xml:space="preserve">gdeltforge</text>
    <line x1="0" y1="38" x2="860" y2="38" stroke="#1f2540"></line>
    <g>
      <text x="28" y="72" fill="#c3a463" font-size="14.5" xml:space="preserve">$ gdeltforge sample --dataset events --mode indexed -n 20 --seed 7</text>
      <text x="28" y="98" fill="#7c8399" font-size="14.5" xml:space="preserve">  [17:14:02] INFO   FileIndex: 4,748 files, 542,483,885 total rows</text>
      <text x="28" y="120" fill="#7c8399" font-size="14.5" xml:space="preserve">  [17:14:02] INFO   Sampling 20 rows across 4,748 files</text>
      <text x="28" y="142" fill="#9fd6a8" font-size="14.5" xml:space="preserve">  [17:14:03] INFO   Saved indexed sample (20 rows) -&gt; sample.parquet</text>
      <text x="28" y="188" fill="#c3a463" font-size="14.5" xml:space="preserve">$ gdeltforge crossref --events sample.parquet --gkg-version v2 \\</text>
      <text x="28" y="210" fill="#c3a463" font-size="14.5" xml:space="preserve">      --out sample_with_gkg.parquet</text>
      <text x="28" y="236" fill="#7c8399" font-size="14.5" xml:space="preserve">  [17:15:11] INFO   Two-hop join via Mentions (filter pushdown)</text>
      <text x="28" y="258" fill="#7c8399" font-size="14.5" xml:space="preserve">  [17:15:19] INFO   20 events -&gt; 63 event/article pairs</text>
      <text x="28" y="280" fill="#9fd6a8" font-size="14.5" xml:space="preserve">  [17:15:19] INFO   Saved crossref output -&gt; sample_with_gkg.parquet</text>
      <text x="28" y="326" fill="#c3a463" font-size="14.5" xml:space="preserve">$ gdeltforge codes ActionGeo_CountryCode --search korea</text>
      <text x="28" y="352" fill="#e8e4d8" font-size="14.5" xml:space="preserve">  KN  Korea, North</text>
      <text x="28" y="374" fill="#e8e4d8" font-size="14.5" xml:space="preserve">  KS  Korea, South</text>
      <text x="28" y="400" fill="#5b6480" font-size="14.5" xml:space="preserve">$ █</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="859" height="419" rx="14" fill="none" stroke="#252b48"></rect>
</svg>