# ================================
#   GDELT PIPELINE CONFIGURATION
#   (built-in fallback default)
# ================================
#
# load_config() falls back to this file, bundled inside the installed
# package, only when no config is found any other way: no --config, no
# GDELTFORGE_CONFIG, and no config/settings.yaml on disk. It exists so
# a fresh `pip install gdeltforge` works immediately with zero setup
# (e.g. a Colab session, which loses any locally-created file the
# moment the session resets), not to replace config/settings.example.yaml
# as the file you'd hand-edit for a real, ongoing project.
#
# Deliberately conservative, not a copy of settings.example.yaml: every
# row and every column survive by default (no columns_to_check, no
# output_columns pruning), so a first run's output is never silently
# shaped by choices you didn't make. It also gets written out to the
# resolved config path the first time it's used, so it becomes a normal,
# editable file for the rest of that session; load_config() logs when
# this happens. See docs/configuration.md for what every key here does,
# and settings.example.yaml for a heavily-annotated, opinionated
# starting point instead of this one.

# Columns present in each GDELT dataset. GDELT's own field layout, not
# environment-specific: never needs editing regardless of where this
# runs.
