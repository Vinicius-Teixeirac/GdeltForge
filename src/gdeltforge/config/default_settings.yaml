# ================================
#       DIRECTORY PATHS
# ================================
# Real, working relative paths (unlike settings.example.yaml's
# "./path_example/..." placeholders): everything lands under ./data,
# relative to wherever the command is run from. Fine for a Colab
# session or a quick local trial; point --config/GDELTFORGE_CONFIG at
# a real file (e.g. on a mounted Drive) for anything you want to
# survive past the current session.
paths:
  downloaded_data_directory: "./data/events/raw"
  unzipped_data_directory: "./data/events/csv"
  parquet_data_directory: "./data/events/parquet"
  filtered_data_directory: "./data/events/filtered"
  parquet_historical_directory: "./data/events/historical"
  filtered_historical_directory: "./data/events/filtered_historical"

  gkg_v2_downloaded_data_directory: "./data/gkg_v2/raw"
  gkg_v2_unzipped_data_directory: "./data/gkg_v2/csv"
  gkg_v2_parquet_data_directory: "./data/gkg_v2/parquet"
  gkg_v2_filtered_data_directory: "./data/gkg_v2/filtered"

  mentions_downloaded_data_directory: "./data/mentions/raw"
  mentions_unzipped_data_directory: "./data/mentions/csv"
  mentions_parquet_data_directory: "./data/mentions/parquet"
  mentions_filtered_data_directory: "./data/mentions/filtered"

  gkg_v1_downloaded_data_directory: "./data/gkg_v1/raw"
  gkg_v1_unzipped_data_directory: "./data/gkg_v1/csv"
  gkg_v1_parquet_data_directory: "./data/gkg_v1/parquet"
  gkg_v1_filtered_data_directory: "./data/gkg_v1/filtered"

  gkg_v1_counts_downloaded_data_directory: "./data/gkg_v1_counts/raw"
  gkg_v1_counts_unzipped_data_directory: "./data/gkg_v1_counts/csv"
  gkg_v1_counts_parquet_data_directory: "./data/gkg_v1_counts/parquet"
  gkg_v1_counts_filtered_data_directory: "./data/gkg_v1_counts/filtered"

# ================================
#          STAGE SETTINGS
# ================================

scraping:
  retries: 3
  timeout: 30
  method: requests
  chromedriver_path: null
  max_workers: 8

converter:
  keep_unzipped: false
  file_pattern: "*.zip"
  # null = os.cpu_count(): scales down naturally on a resource-constrained
  # environment like Colab's free tier, unlike a hardcoded worker count.
  max_workers: null
  partitioning:
    enabled: false
    rules:
      - file_type: yearly
        by: ["Year"]
      - file_type: monthly
        by: ["Year", "MonthYear"]

# Conservative on purpose: no columns_to_check means every row survives
# `filter` (dropna against an empty column list is a documented no-op,
# not "check nothing and drop everything"), and no output_columns/
# float32_columns means every column stays too, at full precision. If
# you want the storage/row-filtering wins settings.example.yaml
# demonstrates, add those sections back in deliberately.
filter:
  max_workers: null
  columns_to_check:
    gdelt_event: []
    gdelt_gkg_v2: []
    gdelt_mentions: []
    gdelt_gkg_v1: []
    gdelt_gkg_v1_counts: []
