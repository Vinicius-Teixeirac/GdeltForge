# ================================
#   GDELT PIPELINE CONFIGURATION
#   Copy this file to settings.yaml
#   and adjust the paths as needed.
# ================================

# Columns present in the GDELT Event dataset
columns:
  gdelt_event:
    - GlobalEventID
    - Day
    - MonthYear
    - Year
    - FractionDate
    - Actor1Code
    - Actor1Name
    - Actor1CountryCode
    - Actor1KnownGroupCode
    - Actor1EthnicCode
    - Actor1Religion1Code
    - Actor1Religion2Code
    - Actor1Type1Code
    - Actor1Type2Code
    - Actor1Type3Code
    - Actor2Code
    - Actor2Name
    - Actor2CountryCode
    - Actor2KnownGroupCode
    - Actor2EthnicCode
    - Actor2Religion1Code
    - Actor2Religion2Code
    - Actor2Type1Code
    - Actor2Type2Code
    - Actor2Type3Code
    - IsRootEvent
    - EventCode
    - EventBaseCode
    - EventRootCode
    - QuadClass
    - GoldsteinScale
    - NumMentions
    - NumSources
    - NumArticles
    - AvgTone
    - Actor1Geo_Type
    - Actor1Geo_FullName
    - Actor1Geo_CountryCode
    - Actor1Geo_ADM1Code
    - Actor1Geo_Lat
    - Actor1Geo_Long
    - Actor1Geo_FeatureID
    - Actor2Geo_Type
    - Actor2Geo_FullName
    - Actor2Geo_CountryCode
    - Actor2Geo_ADM1Code
    - Actor2Geo_Lat
    - Actor2Geo_Long
    - Actor2Geo_FeatureID
    - ActionGeo_Type
    - ActionGeo_FullName
    - ActionGeo_CountryCode
    - ActionGeo_ADM1Code
    - ActionGeo_Lat
    - ActionGeo_Long
    - ActionGeo_FeatureID
    - DATEADDED
    - SOURCEURL

  # Events at native GDELT 2.0 granularity: the same gdeltv2 15-minute
  # master file list gkg-v2/mentions use, not the daily archive above.
  # Genuinely a different schema, not just finer granularity: 61 columns
  # vs. the daily archive's 58, confirmed by downloading one real file
  # from each source and diffing columns directly. The 3 extra columns
  # (Actor1Geo_ADM2Code, Actor2Geo_ADM2Code, ActionGeo_ADM2Code) are
  # inserted one per geo block, right after each block's own ADM1Code.
  # Opt-in and much slower in practice: ~81x the file count of the daily
  # archive for the same date range (~96 files/day vs. 1), though total
  # size stays modest (~40 GB for the full 2015-present archive, since
  # Events rows are compact structured data, not GKG's free text).
  gdelt_event_15min:
    - GlobalEventID
    - Day
    - MonthYear
    - Year
    - FractionDate
    - Actor1Code
    - Actor1Name
    - Actor1CountryCode
    - Actor1KnownGroupCode
    - Actor1EthnicCode
    - Actor1Religion1Code
    - Actor1Religion2Code
    - Actor1Type1Code
    - Actor1Type2Code
    - Actor1Type3Code
    - Actor2Code
    - Actor2Name
    - Actor2CountryCode
    - Actor2KnownGroupCode
    - Actor2EthnicCode
    - Actor2Religion1Code
    - Actor2Religion2Code
    - Actor2Type1Code
    - Actor2Type2Code
    - Actor2Type3Code
    - IsRootEvent
    - EventCode
    - EventBaseCode
    - EventRootCode
    - QuadClass
    - GoldsteinScale
    - NumMentions
    - NumSources
    - NumArticles
    - AvgTone
    - Actor1Geo_Type
    - Actor1Geo_FullName
    - Actor1Geo_CountryCode
    - Actor1Geo_ADM1Code
    - Actor1Geo_ADM2Code
    - Actor1Geo_Lat
    - Actor1Geo_Long
    - Actor1Geo_FeatureID
    - Actor2Geo_Type
    - Actor2Geo_FullName
    - Actor2Geo_CountryCode
    - Actor2Geo_ADM1Code
    - Actor2Geo_ADM2Code
    - Actor2Geo_Lat
    - Actor2Geo_Long
    - Actor2Geo_FeatureID
    - ActionGeo_Type
    - ActionGeo_FullName
    - ActionGeo_CountryCode
    - ActionGeo_ADM1Code
    - ActionGeo_ADM2Code
    - ActionGeo_Lat
    - ActionGeo_Long
    - ActionGeo_FeatureID
    - DATEADDED
    - SOURCEURL

  # GKG 2.1 (the current, actively-produced format, live since Feb 2015).
  # Column order confirmed against the real parser in aamend/spark-gdelt
  # (GdeltParser.scala's parseGkgV2, not just the codebook), since this is
  # a headerless CSV where order is load-bearing. Names follow the
  # official codebook: http://data.gdeltproject.org/documentation/GDELT-Global_Knowledge_Graph_Codebook-V2.1.pdf
  gdelt_gkg_v2:
    - GKGRECORDID
    - V2.1DATE
    - V2SOURCECOLLECTIONIDENTIFIER
    - V2SOURCECOMMONNAME
    - V2DOCUMENTIDENTIFIER
    - V1COUNTS
    - V2.1COUNTS
    - V1THEMES
    - V2ENHANCEDTHEMES
    - V1LOCATIONS
    - V2ENHANCEDLOCATIONS
    - V1PERSONS
    - V2ENHANCEDPERSONS
    - V1ORGANIZATIONS
    - V2ENHANCEDORGANIZATIONS
    - V1.5TONE
    - V2.1ENHANCEDDATES
    - V2GCAM
    - V2.1SHARINGIMAGE
    - V2.1RELATEDIMAGES
    - V2.1SOCIALIMAGEEMBEDS
    - V2.1SOCIALVIDEOEMBEDS
    - V2.1QUOTATIONS
    - V2.1ALLNAMES
    - V2.1AMOUNTS
    - V2.1TRANSLATIONINFO
    - V2EXTRASXML

  # Mentions: every re-report of an Event by a different article over
  # time (the bridge table between Events and GKG: see the Comparison
  # docs page for why a direct Events<->GKG join isn't possible).
  # 16 real columns, confirmed 2026-08-04 against the official GDELT
  # Event Codebook V2.0's MENTIONS TABLE section (a live download, not
  # just the parser source). parseMentionV2 in aamend/spark-gdelt (the
  # source originally used here) only reads the first 14: the last two,
  # MentionDocTranslationInfo and Extras, are real trailing columns that
  # parser's case class simply never mapped, so verifying against it
  # alone silently missed them, pandas' names=<14 names> against a
  # 16-column file absorbs the two leading columns into an unnamed
  # index instead of raising, so this was a real, silent bug.
  gdelt_mentions:
    - GLOBALEVENTID
    - EventTimeDate
    - MentionTimeDate
    - MentionType
    - MentionSourceName
    - MentionIdentifier
    - SentenceID
    - Actor1CharOffset
    - Actor2CharOffset
    - ActionCharOffset
    - InRawText
    - Confidence
    - MentionDocLen
    - MentionDocTone
    - MentionDocTranslationInfo
    - Extras

  # GKG 1.0 (legacy format: the primary GKG feed April 2013 through February 2015,
  # still published daily since then for backwards compatibility). Unlike
  # GKG 2.1, each row carries EventIds directly, so it joins to Events
  # without the two-hop trip through Mentions that GKG 2.1 needs.
  # Column order confirmed against parseGkgV1 in aamend/spark-gdelt's
  # GdeltParser.scala.
  gdelt_gkg_v1:
    - Date
    - NumArticles
    - Counts
    - Themes
    - Locations
    - Persons
    - Organizations
    - Tone
    - EventIds
    - Sources
    - SourceURLs

  # GKG 1.0 Counts: a separate, narrower daily file, one row per individual
  # count mention (e.g. one row per "12 killed" statement) rather than one
  # row per document. Column order confirmed against parseGkgCountV1 in
  # the same real parser.
  gdelt_gkg_v1_counts:
    - Date
    - NumArticles
    - CountType
    - Count
    - ObjectType
    - Geo_Type
    - Geo_FullName
    - Geo_CountryCode
    - Geo_ADM1Code
    - Geo_Lat
    - Geo_Long
    - Geo_FeatureID
    - EventIds
    - Sources
    - SourceURLs

# Numeric columns, one list per dataset (matching the columns: section above).
# Columns not listed here are read as plain strings.
columns_numeric:
  gdelt_event:
    - GlobalEventID
    - Day
    - MonthYear
    - Year
    - FractionDate
    - IsRootEvent
    - QuadClass
    - GoldsteinScale
    - NumMentions
    - NumSources
    - NumArticles
    - AvgTone
    - Actor1Geo_Type
    - Actor1Geo_Lat
    - Actor1Geo_Long
    - Actor2Geo_Type
    - Actor2Geo_Lat
    - Actor2Geo_Long
    - ActionGeo_Type
    - ActionGeo_Lat
    - ActionGeo_Long
    - DATEADDED

  # Same numeric set as gdelt_event above: the 3 new ADM2Code fields
  # are alphanumeric FIPS-style codes like ADM1Code, not numeric, so they
  # stay strings, same treatment ADM1Code already gets.
  gdelt_event_15min:
    - GlobalEventID
    - Day
    - MonthYear
    - Year
    - FractionDate
    - IsRootEvent
    - QuadClass
    - GoldsteinScale
    - NumMentions
    - NumSources
    - NumArticles
    - AvgTone
    - Actor1Geo_Type
    - Actor1Geo_Lat
    - Actor1Geo_Long
    - Actor2Geo_Type
    - Actor2Geo_Lat
    - Actor2Geo_Long
    - ActionGeo_Type
    - ActionGeo_Lat
    - ActionGeo_Long
    - DATEADDED

  gdelt_gkg_v2:
    - V2.1DATE
    - V2SOURCECOLLECTIONIDENTIFIER

  gdelt_mentions:
    - GLOBALEVENTID
    - EventTimeDate
    - MentionTimeDate
    - MentionType
    - SentenceID
    - Actor1CharOffset
    - Actor2CharOffset
    - ActionCharOffset
    - InRawText
    - Confidence
    - MentionDocLen
    - MentionDocTone

  gdelt_gkg_v1:
    - Date
    - NumArticles

  gdelt_gkg_v1_counts:
    - Date
    - NumArticles
    - Count
    - Geo_Type
    - Geo_Lat
    - Geo_Long

# ================================
#       DIRECTORY PATHS
# ================================
# The user should customize these.
# Use absolute or relative paths.

paths:
  # Every dataset gets its own directory, with the same four/six stage
  # names nested underneath (raw / csv / parquet / filtered, plus
  # historical / filtered_historical for Events). Events used to live
  # unprefixed at the top level while GKG/Mentions each got their own
  # directory; nesting Events the same way keeps the layout uniform,
  # e.g. data/events/raw next to data/gkg_v2/raw instead of a bare
  # data/raw next to data/gkg_v2_raw.

  # Directory where the pipeline will download ZIP files
  downloaded_data_directory: "./path_example/events/raw" # choose your own directory

  # Directory for extracted CSV files
  unzipped_data_directory: "./path_example/events/csv"

  # Directory for Parquet output
  parquet_data_directory: "./path_example/events/parquet"

  # Directory for filtered Parquet files
  filtered_data_directory: "./path_example/events/filtered"

  # Hive-partitioned Parquet for historical files (yearly / monthly ZIPs).
  # Only used when converter.partitioning.enabled is true.
  parquet_historical_directory: "./path_example/events/historical"

  # Filtered version of the historical Hive dataset.
  # Only used when converter.partitioning.enabled is true.
  filtered_historical_directory: "./path_example/events/filtered_historical"

  # GKG 2.1 and Mentions: same four stages as Events (download / unzip /
  # convert / filter), but their own directories; these publish at
  # 15-minute granularity, not daily, so keeping them separate from
  # Events' paths avoids ever mixing the two archives' files together.
  # No Hive-partitioned historical variant: unlike Events, GKG 2.1 and
  # Mentions have no pre-2013 yearly/monthly archive to partition.
  gkg_v2_downloaded_data_directory: "./path_example/gkg_v2/raw"
  gkg_v2_unzipped_data_directory: "./path_example/gkg_v2/csv"
  gkg_v2_parquet_data_directory: "./path_example/gkg_v2/parquet"
  gkg_v2_filtered_data_directory: "./path_example/gkg_v2/filtered"

  mentions_downloaded_data_directory: "./path_example/mentions/raw"
  mentions_unzipped_data_directory: "./path_example/mentions/csv"
  mentions_parquet_data_directory: "./path_example/mentions/parquet"
  mentions_filtered_data_directory: "./path_example/mentions/filtered"

  # Events at native GDELT 2.0 granularity (--dataset events-15min): same
  # 15-minute cadence as GKG 2.1/Mentions above, so the same reasoning
  # for its own directory applies, and doubly so here, since mixing
  # this with events' own paths wouldn't just be disorganized, it would
  # double-count the same underlying events if both were ever scraped
  # for an overlapping date range. No Hive-partitioned historical
  # variant, same reason as GKG 2.1/Mentions.
  event_15min_downloaded_data_directory: "./path_example/events_15min/raw"
  event_15min_unzipped_data_directory: "./path_example/events_15min/csv"
  event_15min_parquet_data_directory: "./path_example/events_15min/parquet"
  event_15min_filtered_data_directory: "./path_example/events_15min/filtered"

  # GKG 1.0 (legacy) and its separate Counts file: same four stages, own
  # directories. Unlike GKG 2.1/Mentions, GKG 1.0 publishes daily, the same
  # cadence as Events, so it's kept separate purely to avoid mixing
  # schemas, not because of a granularity mismatch.
  gkg_v1_downloaded_data_directory: "./path_example/gkg_v1/raw"
  gkg_v1_unzipped_data_directory: "./path_example/gkg_v1/csv"
  gkg_v1_parquet_data_directory: "./path_example/gkg_v1/parquet"
  gkg_v1_filtered_data_directory: "./path_example/gkg_v1/filtered"

  gkg_v1_counts_downloaded_data_directory: "./path_example/gkg_v1_counts/raw"
  gkg_v1_counts_unzipped_data_directory: "./path_example/gkg_v1_counts/csv"
  gkg_v1_counts_parquet_data_directory: "./path_example/gkg_v1_counts/parquet"
  gkg_v1_counts_filtered_data_directory: "./path_example/gkg_v1_counts/filtered"

# ================================
#          STAGE SETTINGS
# ================================

scraping:
  retries: 3  # must be a real number, not null: feeds range(retries) directly
  timeout: 30  # seconds

  # How to collect the list of downloadable GDELT files:
  #   "requests" (default, recommended): plain HTTP GET + HTML parsing.
  #       No browser dependency, no version-mismatch failures, ~10x faster.
  #   "selenium": drives headless Chrome. Kept as a fallback in case the
  #       GDELT page ever becomes JS-rendered. Requires `uv pip install
  #       '.[selenium]'` and a Chrome install with a matching ChromeDriver.
  method: requests

  # Only used when method is "selenium".
  # Optional: absolute path to chromedriver.exe
  # Set this when automatic download is blocked by a network firewall.
  # Download the matching version from:
  # https://googlechromelabs.github.io/chrome-for-testing/
  chromedriver_path: null

  # Concurrent download workers. Downloads are I/O-bound (network wait),
  # so this can comfortably exceed CPU core count; raise/lower based on
  # your connection and how politely you want to hit data.gdeltproject.org.
  # Unlike converter.max_workers/filter.max_workers below, null is not a
  # valid "auto" value here: it falls all the way into requests' connection
  # pool sizing and fails every download. Set a real number.
  max_workers: 8

converter:
  keep_unzipped: false
  file_pattern: "*.zip"

  # Concurrent conversion worker processes. Conversion is CPU-bound (CSV
  # parsing + parquet writing), so this defaults to the machine's core
  # count. Lower it if the conversion stage competes with other work.
  max_workers: null  # null = os.cpu_count()

  # Optional, per dataset: overrides the scalar max_workers above for one
  # dataset only. Worthwhile because a worker count safe for one dataset
  # is not necessarily safe for another; a wide, free-text-heavy dataset
  # like GKG 2.1 can exhaust memory at a worker count a narrower dataset
  # handles fine, and output_columns below changes that math per dataset
  # too. See the capacity planning reference in configuration.md for real
  # measured numbers this was benchmarked against.
  max_workers_by_dataset:
    gdelt_gkg_v2: 8 # example

  # Optional, per dataset: restricts CSV parsing to just these columns
  # instead of every column the dataset defines (see columns.<dataset>
  # above). names is still the full column list, matching each raw
  # position on files with no header row, but pandas only allocates and
  # decodes the columns listed here. Worth doing for GKG 2.1 in particular:
  # most of its columns are free-text fields (quotations, all-names, GCAM,
  # extras XML, image/video embeds) a themes/tone/persons/orgs crossref
  # never reads, and cutting them sped up real measured conversion by
  # roughly 3x at the same worker count, before even raising max_workers.
  #
  # If crossref is part of your plan, keep each dataset's join key no
  # matter what else you prune here: GlobalEventID (gdelt_event), EventIds
  # (gdelt_gkg_v1 / gdelt_gkg_v1_counts), V2DOCUMENTIDENTIFIER
  # (gdelt_gkg_v2), or GLOBALEVENTID + MentionIdentifier (gdelt_mentions).
  # convert warns if one of these is missing from a configured
  # output_columns list, same as filter does for its own output_columns
  # below; see configuration.md for the full explanation.
  output_columns:
    gdelt_gkg_v2: # example: keep only the crossref join key + ML-relevant fields
      - GKGRECORDID
      - V2.1DATE
      - V2DOCUMENTIDENTIFIER
      - V1THEMES
      - V2ENHANCEDTHEMES
      - V1PERSONS
      - V2ENHANCEDPERSONS
      - V1ORGANIZATIONS
      - V2ENHANCEDORGANIZATIONS
      - V1.5TONE

  # Write codec per dataset, same setting and same zstd default as
  # filter.compression below. Overriding it here changes converter's own
  # intermediate parquet output (parquet_data_directory), independent of
  # whatever filter.compression is set to for the filtered output that
  # follows it.
  compression:
    gdelt_gkg_v2: snappy # example override away from the zstd default

  # Optional Hive partitioning for pre-daily (yearly / monthly) source files.
  # When enabled, yearly and monthly ZIPs are written as a Hive-partitioned
  # dataset under parquet_historical_directory instead of flat files.
  # Daily ZIPs (2013-present) always go to parquet_data_directory unchanged.
  partitioning:
    enabled: false
    rules:
      - file_type: yearly    # e.g. 1979.zip
        by: ["Year"]
      - file_type: monthly   # e.g. 200601.zip
        by: ["Year", "MonthYear"]

# The user should customize this.
# Provide columns so the filter drops instances with NaN values on them.
# One list per dataset (matching columns: / columns_numeric: above).
filter:
  # Concurrent filter worker processes, same tradeoffs as converter.max_workers
  # above: CPU-bound (per-batch pandas dropna + parquet write), so this
  # defaults to the machine's core count. Lower it if filtering competes
  # with other work, or if you've had to lower converter.max_workers for
  # the same reason.
  max_workers: null  # null = os.cpu_count()

  columns_to_check:
    gdelt_event: # example
      - GlobalEventID
      - Actor1Name
      - Actor2Name
      - QuadClass
      - Actor1Geo_Lat
      - Actor1Geo_Long
      - Actor2Geo_Lat
      - Actor2Geo_Long
      - ActionGeo_Lat
      - ActionGeo_Long
      - Day
    gdelt_event_15min: # example, same shape as gdelt_event above
      - GlobalEventID
      - Actor1Name
      - Actor2Name
      - QuadClass
      - Actor1Geo_Lat
      - Actor1Geo_Long
      - Actor2Geo_Lat
      - Actor2Geo_Long
      - ActionGeo_Lat
      - ActionGeo_Long
      - Day
    gdelt_gkg_v2: # example
      - GKGRECORDID
      - V2.1DATE
      - V2DOCUMENTIDENTIFIER
    gdelt_mentions: # example
      - GLOBALEVENTID
      - MentionIdentifier
      - MentionTimeDate
    gdelt_gkg_v1: # example
      - Date
      - EventIds
      - Themes
    gdelt_gkg_v1_counts: # example
      - Date
      - EventIds
      - Count

  # Optional, per dataset, all independent of columns_to_check above.
  # output_columns projects the written file down to a subset of columns
  # (row-filtering still runs against the full columns_to_check first); a
  # dataset left out of this map keeps every column, matching pre-existing
  # configs. Worth setting for GKG in particular: most of its columns are
  # free-text fields (quotations, all-names, GCAM, extras XML, image/video
  # embeds) that a themes/tone/persons/orgs crossref never reads, and
  # dropping them cuts real measured disk usage by roughly 7x.
  #
  # If crossref is part of your plan, keep each dataset's join key no
  # matter what else you prune: GlobalEventID (gdelt_event), EventIds
  # (gdelt_gkg_v1 / gdelt_gkg_v1_counts), V2DOCUMENTIDENTIFIER
  # (gdelt_gkg_v2), or GLOBALEVENTID + MentionIdentifier (gdelt_mentions).
  # filter warns if one of these is missing from a configured
  # output_columns list; see configuration.md for the full explanation,
  # including why SOURCEURL is not on this list despite looking related.
  output_columns:
    gdelt_gkg_v2: # example: keep only the crossref join key + ML-relevant fields
      - GKGRECORDID
      - V2.1DATE
      - V2DOCUMENTIDENTIFIER
      - V1THEMES
      - V2ENHANCEDTHEMES
      - V1PERSONS
      - V2ENHANCEDPERSONS
      - V1ORGANIZATIONS
      - V2ENHANCEDORGANIZATIONS
      - V1.5TONE

  # Write codec per dataset. pyarrow ships zstd/gzip/brotli/lz4 alongside
  # snappy, no extra dependency needed. Defaults to zstd when a dataset
  # has no entry here (measured roughly 30% smaller than snappy on real
  # GDELT Events data, at comparable or faster write speed, and fully
  # lossless, so there's no accuracy tradeoff in taking the default).
  # Override to a specific codec per dataset here if ever needed.
  compression:
    gdelt_gkg_v2: snappy # example override away from the zstd default

  # Opt-in, per dataset: narrows these float64 columns to float32 on
  # write. A dataset left out of this map (the default) keeps every float
  # column at full float64 precision.
  #
  # Unlike compression above, this is a real precision change, not free
  # storage: real GDELT float columns, AvgTone especially, have been
  # observed with up to 15 significant figures in source data, well past
  # float32's ~7. Casting a column here means the values it holds will
  # measurably change on read, not just take up less space on disk. Only
  # enable it for specific columns where that tradeoff is acceptable for
  # your use case, and never as a blanket setting.
  float32_columns:
    gdelt_event: # example
      - Actor1Geo_Lat
      - Actor1Geo_Long
