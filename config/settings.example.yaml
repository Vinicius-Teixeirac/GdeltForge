# ================================
#   GDELT PIPELINE CONFIGURATION
#   Copy this file to settings.yaml
#   and adjust the paths as needed.
# ================================

# Columns present in the GDELT Event dataset
columns:
  gdelt_event:
    - GlobalEventID
    - Day
    - MonthYear
    - Year
    - FractionDate
    - Actor1Code
    - Actor1Name
    - Actor1CountryCode
    - Actor1KnownGroupCode
    - Actor1EthnicCode
    - Actor1Religion1Code
    - Actor1Religion2Code
    - Actor1Type1Code
    - Actor1Type2Code
    - Actor1Type3Code
    - Actor2Code
    - Actor2Name
    - Actor2CountryCode
    - Actor2KnownGroupCode
    - Actor2EthnicCode
    - Actor2Religion1Code
    - Actor2Religion2Code
    - Actor2Type1Code
    - Actor2Type2Code
    - Actor2Type3Code
    - IsRootEvent
    - EventCode
    - EventBaseCode
    - EventRootCode
    - QuadClass
    - GoldsteinScale
    - NumMentions
    - NumSources
    - NumArticles
    - AvgTone
    - Actor1Geo_Type
    - Actor1Geo_FullName
    - Actor1Geo_CountryCode
    - Actor1Geo_ADM1Code
    - Actor1Geo_Lat
    - Actor1Geo_Long
    - Actor1Geo_FeatureID
    - Actor2Geo_Type
    - Actor2Geo_FullName
    - Actor2Geo_CountryCode
    - Actor2Geo_ADM1Code
    - Actor2Geo_Lat
    - Actor2Geo_Long
    - Actor2Geo_FeatureID
    - ActionGeo_Type
    - ActionGeo_FullName
    - ActionGeo_CountryCode
    - ActionGeo_ADM1Code
    - ActionGeo_Lat
    - ActionGeo_Long
    - ActionGeo_FeatureID
    - DATEADDED
    - SOURCEURL

  # GKG 2.1 (the current, actively-produced format, live since Feb 2015).
  # Column order confirmed against the real parser in aamend/spark-gdelt
  # (GdeltParser.scala's parseGkgV2, not just the codebook), since this is
  # a headerless CSV where order is load-bearing. Names follow the
  # official codebook: http://data.gdeltproject.org/documentation/GDELT-Global_Knowledge_Graph_Codebook-V2.1.pdf
  gdelt_gkg_v2:
    - GKGRECORDID
    - V2.1DATE
    - V2SOURCECOLLECTIONIDENTIFIER
    - V2SOURCECOMMONNAME
    - V2DOCUMENTIDENTIFIER
    - V1COUNTS
    - V2.1COUNTS
    - V1THEMES
    - V2ENHANCEDTHEMES
    - V1LOCATIONS
    - V2ENHANCEDLOCATIONS
    - V1PERSONS
    - V2ENHANCEDPERSONS
    - V1ORGANIZATIONS
    - V2ENHANCEDORGANIZATIONS
    - V1.5TONE
    - V2.1ENHANCEDDATES
    - V2GCAM
    - V2.1SHARINGIMAGE
    - V2.1RELATEDIMAGES
    - V2.1SOCIALIMAGEEMBEDS
    - V2.1SOCIALVIDEOEMBEDS
    - V2.1QUOTATIONS
    - V2.1ALLNAMES
    - V2.1AMOUNTS
    - V2.1TRANSLATIONINFO
    - V2EXTRASXML

  # Mentions: every re-report of an Event by a different article over
  # time (the bridge table between Events and GKG: see the Comparison
  # docs page for why a direct Events<->GKG join isn't possible).
  # Column order confirmed against parseMentionV2 in the same real parser.
  gdelt_mentions:
    - GLOBALEVENTID
    - EventTimeDate
    - MentionTimeDate
    - MentionType
    - MentionSourceName
    - MentionIdentifier
    - SentenceID
    - Actor1CharOffset
    - Actor2CharOffset
    - ActionCharOffset
    - InRawText
    - Confidence
    - MentionDocLen
    - MentionDocTone

# Numeric columns, one list per dataset (matching the columns: section above).
# Columns not listed here are read as plain strings.
columns_numeric:
  gdelt_event:
    - GlobalEventID
    - Day
    - MonthYear
    - Year
    - FractionDate
    - IsRootEvent
    - QuadClass
    - GoldsteinScale
    - NumMentions
    - NumSources
    - NumArticles
    - AvgTone
    - Actor1Geo_Type
    - Actor1Geo_Lat
    - Actor1Geo_Long
    - Actor2Geo_Type
    - Actor2Geo_Lat
    - Actor2Geo_Long
    - ActionGeo_Type
    - ActionGeo_Lat
    - ActionGeo_Long
    - DATEADDED

  gdelt_gkg_v2:
    - V2.1DATE
    - V2SOURCECOLLECTIONIDENTIFIER

  gdelt_mentions:
    - GLOBALEVENTID
    - EventTimeDate
    - MentionTimeDate
    - MentionType
    - SentenceID
    - Actor1CharOffset
    - Actor2CharOffset
    - ActionCharOffset
    - InRawText
    - Confidence
    - MentionDocLen
    - MentionDocTone

# ================================
#       DIRECTORY PATHS
# ================================
# The user should customize these.
# Use absolute or relative paths.

paths:
  # Directory where the pipeline will download ZIP files
  downloaded_data_directory: "./path_example/raw_data" # choose your own directory

  # Directory for extracted CSV files
  unzipped_data_directory: "./path_example/csv"

  # Directory for Parquet output
  parquet_data_directory: "./path_example/parquet"

  # Directory for filtered Parquet files
  filtered_data_directory: "./path_example/filtered"

  # Hive-partitioned Parquet for historical files (yearly / monthly ZIPs).
  # Only used when converter.partitioning.enabled is true.
  parquet_historical_directory: "./path_example/parquet_historical"

  # Filtered version of the historical Hive dataset.
  # Only used when converter.partitioning.enabled is true.
  filtered_historical_directory: "./path_example/filtered_historical"

  # GKG 2.1 and Mentions: same four stages as Events (download / unzip /
  # convert / filter), but their own directories; these publish at
  # 15-minute granularity, not daily, so keeping them separate from
  # Events' paths avoids ever mixing the two archives' files together.
  # No Hive-partitioned historical variant: unlike Events, GKG 2.1 and
  # Mentions have no pre-2013 yearly/monthly archive to partition.
  gkg_v2_downloaded_data_directory: "./path_example/gkg_v2_raw"
  gkg_v2_unzipped_data_directory: "./path_example/gkg_v2_csv"
  gkg_v2_parquet_data_directory: "./path_example/gkg_v2_parquet"
  gkg_v2_filtered_data_directory: "./path_example/gkg_v2_filtered"

  mentions_downloaded_data_directory: "./path_example/mentions_raw"
  mentions_unzipped_data_directory: "./path_example/mentions_csv"
  mentions_parquet_data_directory: "./path_example/mentions_parquet"
  mentions_filtered_data_directory: "./path_example/mentions_filtered"

# ================================
#          STAGE SETTINGS
# ================================

scraping:
  retries: 3
  timeout: 30  # seconds

  # How to collect the list of downloadable GDELT files:
  #   "requests" (default, recommended): plain HTTP GET + HTML parsing.
  #       No browser dependency, no version-mismatch failures, ~10x faster.
  #   "selenium": drives headless Chrome. Kept as a fallback in case the
  #       GDELT page ever becomes JS-rendered. Requires `uv pip install
  #       '.[selenium]'` and a Chrome install with a matching ChromeDriver.
  method: requests

  # Only used when method is "selenium".
  # Optional: absolute path to chromedriver.exe
  # Set this when automatic download is blocked by a network firewall.
  # Download the matching version from:
  # https://googlechromelabs.github.io/chrome-for-testing/
  chromedriver_path: null

  # Concurrent download workers. Downloads are I/O-bound (network wait),
  # so this can comfortably exceed CPU core count; raise/lower based on
  # your connection and how politely you want to hit data.gdeltproject.org.
  max_workers: 8

converter:
  keep_unzipped: false
  file_pattern: "*.zip"

  # Concurrent conversion worker processes. Conversion is CPU-bound (CSV
  # parsing + parquet writing), so this defaults to the machine's core
  # count. Lower it if the conversion stage competes with other work.
  max_workers: null  # null = os.cpu_count()

  # Optional Hive partitioning for pre-daily (yearly / monthly) source files.
  # When enabled, yearly and monthly ZIPs are written as a Hive-partitioned
  # dataset under parquet_historical_directory instead of flat files.
  # Daily ZIPs (2013-present) always go to parquet_data_directory unchanged.
  partitioning:
    enabled: false
    rules:
      - file_type: yearly    # e.g. 1979.zip
        by: ["Year"]
      - file_type: monthly   # e.g. 200601.zip
        by: ["Year", "MonthYear"]

# The user should customize this.
# Provide columns so the filter drops instances with NaN values on them.
# One list per dataset (matching columns: / columns_numeric: above).
filter:
  columns_to_check:
    gdelt_event: # example
      - GlobalEventID
      - Actor1Name
      - Actor2Name
      - QuadClass
      - Actor1Geo_Lat
      - Actor1Geo_Long
      - Actor2Geo_Lat
      - Actor2Geo_Long
      - ActionGeo_Lat
      - ActionGeo_Long
      - Day
    gdelt_gkg_v2: # example
      - GKGRECORDID
      - V2.1DATE
      - V2DOCUMENTIDENTIFIER
    gdelt_mentions: # example
      - GLOBALEVENTID
      - MentionIdentifier
      - MentionTimeDate
