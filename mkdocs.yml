site_name: GdeltForge
site_description: Forges the raw GDELT 2.0 archive into clean, reproducibly-sampled, cross-referenced Parquet
repo_url: https://github.com/Vinicius-Teixeirac/GdeltForge
repo_name: GdeltForge
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/emblem.png
  favicon: assets/favicon.png
  font:
    text: Poppins
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/brand.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vinicius-Teixeirac/GdeltForge
      name: GdeltForge on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gdeltforge/
      name: GdeltForge on PyPI

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Comparison to Other Tools: comparison.md
  - CLI Reference: cli-reference.md
  - Filtered Sampling: filtered-sampling.md
  - Recipes: recipes.md
  - Configuration: configuration.md
  - Column Redundancy: column-redundancy.md
  - Crossref Join Semantics: crossref-join-semantics.md
  - Architecture: architecture.md
  - Limitations & Roadmap: limitations-and-roadmap.md
