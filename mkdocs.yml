site_name: GdeltForge
site_description: Forges the raw GDELT archive into clean, reproducibly-sampled, cross-referenced Parquet
site_url: https://vinicius-teixeirac.github.io/GdeltForge/
repo_url: https://github.com/Vinicius-Teixeirac/GdeltForge
repo_name: GdeltForge
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/emblem.png
  favicon: assets/favicon.png
  font:
    text: Poppins
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections      # group the sidebar under section headings
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight

extra_css:
  - assets/brand.css
  - assets/home.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vinicius-Teixeirac/GdeltForge
      name: GdeltForge on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gdeltforge/
      name: GdeltForge on PyPI

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# Nav follows a fixed reading order: run it (Getting Started), understand
# it (Concepts), do something with it (Guides), look something up
# (Reference), know its edges (Project). A page's URL never depends on
# this list, so regrouping it doesn't break any external link.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts:
      - Architecture: architecture.md
      - Comparison to Other Tools: comparison.md
  - Guides:
      - Recipes: recipes.md
  - Reference:
      - CLI Reference: cli-reference.md
      - Configuration: configuration.md
      - Filtered Sampling: filtered-sampling.md
      - Crossref Join Semantics: crossref-join-semantics.md
      - Column Redundancy: column-redundancy.md
      - Known Absent Files: known-absent-files.md
  - Project:
      - Limitations & Roadmap: limitations-and-roadmap.md
