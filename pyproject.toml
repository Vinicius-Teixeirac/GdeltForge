[project]
name = "gdeltforge"
dynamic = ["version"]
description = "Forges the raw GDELT 2.0 archive into clean, reproducibly-sampled, cross-referenced Parquet"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Vinícius Teixeira", email = "vinicius.teixeira.carvalho@usp.br" },
]
keywords = [
    "gdelt",
    "events",
    "data-pipeline",
    "etl",
    "parquet",
    "sampling",
    "data-engineering",
    "web-scraping",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "tqdm>=4.60",
]

[project.urls]
Homepage = "https://vinicius-teixeirac.github.io/GdeltForge/"
Documentation = "https://vinicius-teixeirac.github.io/GdeltForge/"
Repository = "https://github.com/Vinicius-Teixeirac/GdeltForge"
Issues = "https://github.com/Vinicius-Teixeirac/GdeltForge/issues"
Changelog = "https://github.com/Vinicius-Teixeirac/GdeltForge/blob/main/CHANGELOG.md"
"GDELT Project" = "https://www.gdeltproject.org/"

# Only needed for scraping.method: selenium (opt-in fallback). The default
# "requests" method has no browser dependency at all.
[project.optional-dependencies]
selenium = [
    "selenium>=4.0",
    "webdriver-manager>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
lint = [
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
gdeltforge = "gdeltforge.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdeltforge"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI/TestPyPI reject uploads whose version has a PEP 440 local version
# segment (the default dev-build "+g<hash>" suffix) with a hard 400 - so
# without this, no dev build (a TestPyPI rehearsal, or CI's own build-check)
# can ever be uploaded anywhere, only an exact tagged commit.
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/gdeltforge/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gdeltforge"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# pyarrow.dataset genuinely exports Expression/field/Dataset at runtime;
# its stubs just don't declare them in __all__, so pyright treats normal,
# documented usage as a private-import violation.
reportPrivateImportUsage = false
