[project]
name = "gdeltforge"
dynamic = ["version"]
description = "Forges the raw GDELT 2.0 Events archive into clean, reproducibly-sampled Parquet datasets"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "tqdm>=4.60",
]

# Only needed for scraping.method: selenium (opt-in fallback). The default
# "requests" method has no browser dependency at all.
[project.optional-dependencies]
selenium = [
    "selenium>=4.0",
    "webdriver-manager>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
gdeltforge = "gdeltforge.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdeltforge"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/gdeltforge/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
