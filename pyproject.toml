[project]
name = "gdeltforge"
dynamic = ["version"]
description = "Forges the raw GDELT 2.0 Events archive into clean, reproducibly-sampled Parquet datasets"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "tqdm>=4.60",
]

# Only needed for scraping.method: selenium (opt-in fallback). The default
# "requests" method has no browser dependency at all.
[project.optional-dependencies]
selenium = [
    "selenium>=4.0",
    "webdriver-manager>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
lint = [
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
gdeltforge = "gdeltforge.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdeltforge"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/gdeltforge/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gdeltforge"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# pyarrow.dataset genuinely exports Expression/field/Dataset at runtime;
# its stubs just don't declare them in __all__, so pyright treats normal,
# documented usage as a private-import violation.
reportPrivateImportUsage = false
