[project]
name = "gdelt-pipeline"
version = "0.1.0"
description = "A modular data pipeline for the GDELT 2.0 Events Database"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "tqdm>=4.60",
]

# Only needed for scraping.method: selenium (opt-in fallback). The default
# "requests" method has no browser dependency at all.
[project.optional-dependencies]
selenium = [
    "selenium>=4.0",
    "webdriver-manager>=4.0",
]

[tool.uv]
package = false
