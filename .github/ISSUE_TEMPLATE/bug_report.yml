name: Bug report
description: Report a bug and let us improve the package
title: "[BUG]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        0. **Check the issues page**
        Assure your bug isn't already reported.

        1. **Check the version**
        Confirm your version:
        ```bash
        pip show gdeltforge
        ```
        Check the [CHANGELOG](https://github.com/Vinicius-Teixeirac/GdeltForge/blob/main/CHANGELOG.md) seeking the bug/behavior you're about to report. (Recommended) Use the latest version:
        ```bash
        pip install --upgrade gdeltforge
        ```

  - type: input
    id: version
    attributes:
      label: GdeltForge version
      description: Output of `pip show gdeltforge`.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is and how it affects your usage.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: |
        Steps to reproduce the behavior. Example:
           1. Insert '...' in the config file
           2. Try to '....'
           3. Check the output '....'
           4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen. Justify your expectations using the [docs](https://vinicius-teixeirac.github.io/GdeltForge/).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: If applicable, add logs or screenshots to help explain your problem.
      render: shell

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. Debian 13.6"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware specs
      placeholder: "e.g. 16 CPU cores, 16GB of RAM, 2 TB of storage"

  - type: textarea
    id: config
    attributes:
      label: Config file overwrite

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
